<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Révision</title>
  <meta name="theme-color" content="#1f4fd8">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="entete">
    <a class="titre-app" href="#/">Révision</a>
  </header>

  <div id="message" class="message" hidden></div>

  <main id="app" tabindex="-1">
    <p class="chargement">Chargement…</p>
  </main>

  <div id="maj" class="maj" hidden></div>

  <footer class="pied">
    <span id="version-cache">Version du cache : vérification…</span>
  </footer>

  <noscript>
    <p class="chargement">Cette application a besoin de JavaScript pour fonctionner.</p>
  </noscript>

  <!-- Filet de sécurité : si app.js ne démarre pas (fichier absent ou erreur), on l'écrit à l'écran. -->
  <script>
    setTimeout(function () {
      var chargement = document.querySelector('.chargement');
      if (chargement) {
        chargement.textContent = 'L’application n’a pas démarré. Recharge la page ; si le problème persiste, un fichier (app.js ou db.js) est absent ou contient une erreur.';
      }
    }, 8000);
  </script>

  <script type="module" src="./app.js"></script>
</body>
</html>
